const tot=()=>D.items.reduce((a,i)=>a+val(i),0);
function sections(){$("secs").innerHTML=Object.keys(S).map(k=>{
const rows=D.items.map((i,x)=>[i,x]).filter(a=>a[0].s==k&&(a[0].n+" "+(a[0].g||"")).includes($("q").value.trim())).map(([i,x])=>`<tr><td>${i.n}</td>${k=="wr"?`<td><input type="text" style="width:80px" placeholder="القياس" data-x="${x}" data-k="g" value="${i.g||""}"></td>`:""}<td><input type="text" inputmode="decimal" data-x="${x}" data-k="q" value="${i.q}"> ${S[k][1]}<div class="mv"><input type="text" inputmode="decimal" step="any" class="dl" placeholder="كمية"><button data-x="${x}" data-p="1">+ إضافة</button><button data-x="${x}" data-p="-1" class="x">− سحب</button></div></td>
${k=="pl"?`<td class="vw" data-r="${x}">${f(i.q*D.bag)} كغ</td>`:""}<td>${k=="cu"?D.cu.toFixed(2):`<input type="text" inputmode="decimal" step="0.01" data-x="${x}" data-k="p" value="${i.p}">`}</td><td class="v1" data-r="${x}">${f(val(i))}</td><td class="v2" data-r="${x}">${f(val(i)*D.rate)}</td><td><button class="x" data-d="${x}">حذف</button></td></tr>`).join("");
return `<h2>${S[k][0]}</h2><div class="sc"><table><thead><tr><th>الصنف</th>${k=="wr"?"<th>القياس</th>":""}<th>الكمية الموجودة</th>${k=="pl"?"<th>الوزن</th>":""}<th>سعر ${S[k][1]} $</th><th>القيمة $</th><th>القيمة ل.س</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="add"><input id="n${k}" placeholder="اسم صنف جديد"><button data-a="${k}">إضافة</button></div>`}).join("")}
function stats(){const T=tot(),by=k=>D.items.filter(i=>i.s==k),sum=k=>by(k).reduce((a,i)=>a+val(i),0),qs=k=>by(k).reduce((a,i)=>a+i.q,0);
const top=[...D.items].sort((a,b)=>val(b)-val(a))[0];
$("st").innerHTML=[["إجمالي القيمة $","$"+f(T)],["إجمالي القيمة ل.س",f(T*D.rate)],["النحاس الموجود",f(qs("cu"))+" كغ"],["البلاستيك",f(qs("pl"))+" كيس ("+f(qs("pl")*D.bag)+" كغ)"],["الأسلاك",f(qs("wr"))+" متر"],["عدد الأصناف",D.items.length],["أعلى صنف قيمة",top?top.n:"-"]].map(a=>`<div class="c"><h3>${a[0]}</h3><div class="big">${a[1]}</div></div>`).join("");
$("sh").innerHTML=Object.keys(S).map(k=>{const p=T?sum(k)/T*100:0;return `<div class="c"><h3>حصة ${S[k][0]}</h3><div class="big">${p.toFixed(1)}%</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}
function hist(){const h=[...D.hist].sort((a,b)=>a.y-b.y);$("hs").innerHTML=h.map((e,i)=>{const d=i?e.t-h[i-1].t:null,pc=i&&h[i-1].t?(d/h[i-1].t*100).toFixed(1):"";
return `<tr><td>${e.y}</td><td>${f(e.t)}</td><td>${f(e.t*e.r)}</td><td>${d===null?"-":(d>=0?"+":"")+f(d)+(pc?` (${pc}%)`:"")}</td><td><button data-L="${e.y}">استرجاع</button> <button class="x" data-H="${e.y}">حذف</button></td></tr>`}).join("")||`<tr><td colspan="5">لا يوجد جرد محفوظ بعد</td></tr>`}
function all(ns){$("rate").value=D.rate;$("cu").value=D.cu;$("bag").value=D.bag;$("yr").value=$("yr").value||new Date().getFullYear();sections();stats();hist();applyRO();if(!ns)save()}
$("rate").onchange=e=>{D.rate=num(e.target.value)||1;all()};$("cu").onchange=e=>{D.cu=num(e.target.value)||0;all()};$("bag").onchange=e=>{D.bag=num(e.target.value)||25;all()};
$("r1").onclick=()=>{D.rate=138.5;all()};$("r2").onclick=()=>{D.rate=122.5;all()};
$("secs").addEventListener("change",e=>{const t=e.target;if(t.dataset.x){D.items[t.dataset.x][t.dataset.k]=t.dataset.k=="g"?t.value:(num(t.value)||0);if(t.dataset.k!="g")t.value=D.items[t.dataset.x][t.dataset.k];refresh()}});
$("secs").addEventListener("click",e=>{const t=e.target;if(t.dataset.d){ask(t,()=>{D.items.splice(t.dataset.d,1);all()})}
if(t.dataset.p){const dl=t.closest(".mv").querySelector(".dl"),d=num(dl.value);if(!(d>0)){toast("اكتب الكمية في الخانة أولاً");return}
const it=D.items[t.dataset.x],old=it.q;it.q=Math.max(0,Math.round((it.q+d*t.dataset.p)*1000)/1000);
document.querySelector('input[data-x="'+t.dataset.x+'"][data-k="q"]').value=it.q;dl.value="";refresh();
toast((t.dataset.p>0?"تمت إضافة ":"تم سحب ")+d+" من «"+it.n+"»: "+old+" ← "+it.q)}
if(t.dataset.a){const k=t.dataset.a,n=$("n"+k).value.trim();if(n){D.items.push({s:k,n,q:0,p:0});all()}}});
$("zero").onclick=e=>ask(e.target,()=>{D.items.forEach(i=>i.q=0);all()});
$("sv").onclick=()=>{const y=num($("yr").value);if(!y)return;D.hist=D.hist.filter(e=>e.y!=y);D.hist.push({y,t:tot(),r:D.rate,items:JSON.parse(JSON.stringify(D.items)),cu:D.cu});all()};
$("hs").addEventListener("click",e=>{const t=e.target;if(t.dataset.H)ask(t,()=>{D.hist=D.hist.filter(x=>x.y!=t.dataset.H);all()});
if(t.dataset.L){const h=D.hist.find(x=>x.y==t.dataset.L);if(h)ask(t,()=>{D.items=JSON.parse(JSON.stringify(h.items));D.cu=h.cu;D.rate=h.r;all()})}});
$("q").oninput=sections;
$("pub").onclick=()=>{const h=build(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html;charset=utf-8"}));a.download="index.html";document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل index.html، ارفعه على الاستضافة ليظهر للجميع")};
$("unl").onclick=async()=>{const v=$("pin").value.trim();if(!v){toast("اكتب الرمز");return}const h=await H(v);
let dph;try{dph=JSON.parse(localStorage.getItem("cableDraft")).d.ph}catch(e){}
const cur=ST.ph||dph,first=!cur;
if(!first&&h!==ST.ph&&h!==dph){toast("الرمز غير صحيح");return}
canWrite=true;try{sessionStorage.setItem("cu","1")}catch(e){}loadDraft();$("pin").value="";
if(first)D.ph=h;all(true);if(first){save();toast("تم تعيين رمز التعديل. نزّل النسخة المحدّثة لتثبيته")}bar()};
$("chp").onclick=async()=>{const v=prompt("اكتب رمز التعديل الجديد");if(v&&v.trim()){D.ph=await H(v.trim());save();toast("تم تغيير الرمز، نزّل النسخة المحدّثة لتثبيته")}};
$("out").onclick=()=>{try{sessionStorage.removeItem("cu")}catch(e){}location.reload()};
(()=>{try{if(sessionStorage.getItem("cu")=="1"){canWrite=true;loadDraft()}}catch(e){}all(true);bar()})();
</script>


</body></html>
